# 로컬 개발용 메시징·캐시 인프라 (Kafka / Redis / RabbitMQ)
# 버전은 .env 또는 셸 환경변수로 덮어쓸 수 있고, 값이 없으면 아래 기본값을 사용
name: krr-infra

services:
  # Kafka 4.x는 ZooKeeper 없이 KRaft 단일 노드(broker+controller 겸용)로 실행
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: krr-kafka
    restart: unless-stopped
    ports:
      # 호스트(로컬 애플리케이션)에서 접속하는 포트
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 컨트롤러 쿼럼은 단일 노드이므로 자기 자신만 투표자로 등록
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      # 컨테이너끼리는 INTERNAL(kafka:19092), 호스트에서는 HOST(localhost:9092)로 접속
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 브로커라 내부 토픽 복제본은 1로 축소
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      # 로컬에서는 컨슈머 그룹 리밸런스를 기다리지 않도록 지연 제거
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-krr-local-cluster-0}
    volumes:
      # 이미지가 /var/lib/kafka/data를 VOLUME으로 선언하므로 상위 경로가 아닌 이 경로에 정확히 마운트해야 데이터가 유지됨
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 브로커 API가 실제로 응답하는지 확인
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:${REDIS_VERSION:-8.2.9}-alpine
    container_name: krr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # AOF를 켜서 컨테이너 재시작 후에도 데이터 유지
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
      - --requirepass
      - ${REDIS_PASSWORD:-localredis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-localredis}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    # management 태그는 웹 관리 콘솔 플러그인이 포함된 이미지
    image: rabbitmq:${RABBITMQ_VERSION:-4.2.9}-management-alpine
    container_name: krr-rabbitmq
    restart: unless-stopped
    ports:
      # AMQP 프로토콜 포트
      - "${RABBITMQ_PORT:-5672}:5672"
      # 관리 콘솔 포트 (http://localhost:15672)
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-local}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localrabbit}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  kafka-data:
  redis-data:
  rabbitmq-data:
